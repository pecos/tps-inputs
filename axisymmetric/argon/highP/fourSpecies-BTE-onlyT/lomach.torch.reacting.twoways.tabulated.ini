# choice of solver
[solver]
type = cycle-avg-joule-coupled


[cycle-avg-joule-coupled]
max-iters = 150
solve-em-every-n = 50
axisymmetric = True
input-power = 18000.0
initial-input-power = 18000.0
plasma-solver = lomach
fixed-conductivity = False

[loMach]
axisymmetric = true
mesh = ../../mesh/torch-flow-refine.msh
ref_levels = 0
order = 3
outputFreq = 10
timingFreq = 10
openSystem = True
flow-solver = tomboulides
thermo-solver = reacting-flow
turb-model = algebraic-rans
algebraic-rans/max-mixing-length = 0.01
algebraic-rans/von-karman = 0.41
algebraic-rans/filter = True
algebraic-rans/filter-order = 1

[loMach/reacting]
eddy-Pr = 100.0
eddy-Sc = 100.0

[loMach/reactingFlow]
sub-steps = 1000 # set s.t. substep dt = 1e-11

[loMach/tomboulides]
numerical-integ = false

[spongeMultiplier]
plane = True
planeNormal = '0 1 0'
planePoint = '0 0.45 0'
planeWidth = 0.01
planeMult = 100.0


[io]
outdirBase = output-torch
enableRestart = True
restartMode = singleFileReadWrite

# Set bdfOrder = 1 for restart testing purposes
[time]
enableConstantTimestep = True
dt_fixed = 1e-8
integrator = curlcurl
bdfOrder = 1
maxSolverIteration = 200
solverRelTolerance = 1.0e-12

[boundaryConditions]
numWalls = 4
numInlets = 1
numOutlets = 1

# NB: patch = 2 is the axis

[boundaryConditions/wall1]
# Bottom wall
patch = 3
type = viscous_isothermal
temperature = 300.0

[boundaryConditions/wall2]
# Top wall
patch = 7
type = viscous_isothermal
temperature = 300.0

[boundaryConditions/wall3]
# Torch outer wall
patch = 8
type = viscous_isothermal
temperature = 300.0

[boundaryConditions/inlet1]
patch = 4
type = uniform
velocity = '0.0 0.706'
swirl = 40.0
temperature = 300.0

[boundaryConditions/outlet1]
patch = 6
type = uniform
pressure = 0.0

[boundaryConditions/wall4]
patch = 5
type = viscous_isothermal
temperature = 300.0

###########################################
#        PLASMA MODELS
###########################################
[plasma_models]
species_number = 4
ambipolar = True
two_temperature = False
gas_model = perfect_mixture
chemistry_model = 'mass_action_law'
transport_model = argon_mixture
argon_ternary/third_order_thermal_conductivity = True
radiation_model = net_emission

#[plasma_models]
#radiation_model = net_emission

[plasma_models/radiation_model/net_emission]
coefficient = tabulated
tabulated/filename = ../../radiation-data/nec_sample.0.h5
tabulated/x_log = False
tabulated/f_log = False
tabulated/order = 1

[atoms]
numAtoms = 2

[atoms/atom1]
name = 'Ar'
mass = 39.948e-3 # [kg/mol]

[atoms/atom2]
name = 'E'
mass = 5.48579908782496e-7 # [kg/mol]

[species]
numSpecies = 4
background_index = 4

[species/species4]
name = 'Ar'
composition = '{Ar : 1}'
formation_energy = 0.0
level_degeneracy = 1
#initialMassFraction = 0.998
initialMassFraction = 0.98
perfect_mixture/constant_molar_cv = 1.5
perfect_mixture/constant_molar_cp = 2.5

[species/species3]
name = 'E'
composition = '{E : 1}'
formation_energy = 0.0
level_degeneracy = 1
initialMassFraction = 1.373372e-9
initialElectronTemperature = 298.15
# if gas_model is perfect_mixture, requires heat capacities from input.
# molar heat capacities in unit of universal gas constant.
perfect_mixture/constant_molar_cv = 1.5
perfect_mixture/constant_molar_cp = 2.5

[species/species2]
name = 'Ar.+1'
composition = '{Ar : 1, E : -1}'
formation_energy = 1520571.3883  # [J/mol]  = 15.7596119 eV # Ionization energy (Not sure what the units should be here)
level_degeneracy = 4
initialMassFraction = 1.000086e-4
perfect_mixture/constant_molar_cv = 1.5
perfect_mixture/constant_molar_cp = 2.5

[species/species1]
name = 'Ar_s'
composition = '{Ar : 1}'
formation_energy = 1183401.995380037 # J / mol
level_degeneracy = 53.39
initialMassFraction = 1.0e-9
perfect_mixture/constant_molar_cv = 1.5
perfect_mixture/constant_molar_cp = 2.5

# Species ordering
# [Ar_s, Ar+, E, Ar]
# Ar_s is lumped excited state

[reactions]
number_of_reactions = 6

[reactions/reaction1]
equation = 'Ar + E => Ar.+1 + 2 E'
reaction_energy = 1520571.3883 # [J/mol] # 15.759611899938138 [eV]
reactant_stoichiometry = '0 0 1 1'
product_stoichiometry = '0 1 2 0'
model = bte
bte/index = 0
#model = tabulated
tabulated/filename = './rate-coefficients/Ionization_Ground.h5'
tabulated/x_log = False
tabulated/f_log = False
tabulated/order = 1
detailed_balance = False

[reactions/reaction2]
equation = 'Ar.+1 + 2 E => Ar + E'
reaction_energy = -1520571.3883 # [J/mol]
reactant_stoichiometry = '0 1 2 0'
product_stoichiometry = '0 0 1 1'
model = tabulated
tabulated/filename = './rate-coefficients/Recombination_Ground.h5'
tabulated/x_log = False
tabulated/f_log = False
tabulated/order = 1
detailed_balance = False

[reactions/reaction3]
equation = 'Ar_s + E => Ar.+1 + 2 E'
reaction_energy = 406324.81975761 #4.211260 eV #37169.392919963 # [J/mol] 
reactant_stoichiometry = '1 0 1 0'
product_stoichiometry = '0 1 2 0'
model = bte
bte/index = 1
#model = tabulated
tabulated/filename = './rate-coefficients/Ionization_Lumped.h5'
tabulated/x_log = False
tabulated/f_log = False
tabulated/order = 1
detailed_balance = False

[reactions/reaction4]
equation = 'Ar.+1 + 2 E => Ar_s + E'
reaction_energy = -406324.81975761 #-337169.392919963 # [J/mol]
reactant_stoichiometry = '0 1 2 0'
product_stoichiometry = '1 0 1 0'
model = tabulated
tabulated/filename = './rate-coefficients/Recombination_Lumped.h5'
tabulated/x_log = False
tabulated/f_log = False
tabulated/order = 1
detailed_balance = False

[reactions/reaction5]
equation = 'Ar + E => Ar_s + E'
reaction_energy = 1114246.3852262 #1183401.995380037 # [J/mol]
reactant_stoichiometry = '0 0 1 1'
product_stoichiometry = '1 0 1 0'
model = bte
bte/index = 2
#model = tabulated
tabulated/filename = './rate-coefficients/Excitation_Lumped.h5'
tabulated/x_log = False
tabulated/f_log = False
tabulated/order = 1
detailed_balance = False

[reactions/reaction6]
equation = 'Ar_s + E => Ar + E'
reaction_energy = -1114246.3852262 #-1183401.995380037 # [J/mol]
reactant_stoichiometry = '1 0 1 0'
product_stoichiometry = '0 0 1 1'
model = tabulated
tabulated/filename = './rate-coefficients/Deexcitation_Lumped.h5'
tabulated/x_log = False
tabulated/f_log = False
tabulated/order = 1
detailed_balance = False

#---------------------------------------
# Controls for EM-only solver
# mesh = ../mesh/torch-em-coarse2.msh
# order       =  3                 # FE order (polynomial degree)
#---------------------------------------
[em]
mesh = ../../mesh/torch-em-NEWCOIL.msh
order       =  2                 # FE order (polynomial degree)
ref_levels  =  0
max_iter    =  1000              # max number of iterations
rtol        =  1.0e-12           # solver relative tolerance
atol        =  1.0e-18           # solver absolute tolerance
top_only    =  false             # run current through top branch only
bot_only    =  false             # run current through bottom branch only
current_amplitude = 4e6        # run 1 of heating # A/m^2 (with reactions
current_frequency = 6e6          # 1/s
permeability = 1.25663706e-6     # m * kg / s^2 / A^2

[boltzmannInterface]
order = 3
basisType = 1 #Gauss-Lobatto
h1fec = true
save_to_paraview = true


#[boltzmannInterface]
#order = 3
#basisType = 0
#save_to_paraview = true


[boltzmannSolver]
collisions    = /work/03727/tg830270/vista/tps-venv/vista/tps/boltzmann/BESolver/python/lxcat_data/eAr_crs.Biagi.4sp4r   # cross-section file. 
sp_order      = 3                       # B-spline order in v-space
spline_qpts   = 5                       # number of Gauss-Legendre quadrature points per knot interval    
Nr            = 127                     # number of B-splines used in radial direction
l_max         = 1                       # spherical modes uses, 0, to l_max
n_grids       = 4                       # number of v-space grids
n_sub_clusters= 300                     # number of sub-cluster within each v-space grid
dt            = 1e-2                    # [] non-dimentionalized time w.r.t. oscilation period
cycles        = 12                      # number of max cycles to evolve
Efreq         = 6e6                     # E-field osicllation frequency #[1/s]
solver_type   = transient #steady-state            # two modes, "transient" or "steady-state"
output_fname  = bte_ss #bte_ss                  # prefix for solver output file names.
ee_collisions = 1                       # enable electron-electron Coulombic effects
atol          = 1e-8                    # absolute tolerance
rtol          = 1e-8                    # relative tolerance
max_iter      = 500                     # max iterations for the newton solver
use_gpu       = 1                       # enable GPU use (1)-GPU solver, (0)-CPU solver
export_csv    = 1                       # export the qois to csv file
plot_data     = 1                       # plot data if set to 1 
verbose       = 1                       # verbose output for the BTE solver
Te            = 0.5                     # approximate electron temperature
threads       = 4                       # number of threads to use to assemble operators
output_dir    = tps_bte_x2 #tps_bte_x1              # solver output will be written in this directory. 
tps_bte_max_iter = 2                    # max iterations for tps-bte coupled solve
bte_solve_freq   = 2                    # run bte every x tps cycles.